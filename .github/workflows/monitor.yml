name: Monitor Atenea
on:
  schedule:
    # Colombia = UTC-5. 11:30 a 12:00 COT = 16:30 a 17:00 UTC, cada 5 min
    - cron: "30,35,40,45,50,55 16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:   # para probarlo manualmente
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Revisar página
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Guardar estado
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
